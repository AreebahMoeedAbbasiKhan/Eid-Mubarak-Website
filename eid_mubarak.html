<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eid ul Adha Mubarak</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --gold: #c9a84c;
  --gold-light: #f0d080;
  --gold-dark: #8a6a1a;
  --green-deep: #061a0e;
  --green-mid: #0d3a1e;
  --cream: #fdf6e3;
}
html, body {
  min-height: 100vh;
  background: radial-gradient(ellipse at 50% 0%, #124a2c 0%, #061a0e 60%);
  font-family: 'Amiri', serif;
  overflow-x: hidden;
  color: var(--cream);
}
.stars {
  position: fixed; inset: 0;
  pointer-events: none; z-index: 0; overflow: hidden;
}
.star {
  position: absolute; border-radius: 50%; background: #fff;
  animation: twinkle var(--d) ease-in-out infinite; opacity: 0;
}
@keyframes twinkle {
  0%, 100% { opacity: 0; }
  50% { opacity: var(--op); }
}
.rope {
  position: fixed; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, transparent, var(--gold-dark), var(--gold), var(--gold-dark), transparent);
  z-index: 5;
}
.lanterns {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; justify-content: space-around; z-index: 4; pointer-events: none;
}
.lantern {
  width: 16px; height: 26px; border-radius: 3px 3px 5px 5px;
  position: relative;
  animation: swing var(--sw) ease-in-out infinite;
  transform-origin: top center; margin-top: 0;
}
.lantern::before {
  content: ''; position: absolute; top: -7px; left: 50%;
  transform: translateX(-50%); width: 2px; height: 7px; background: var(--gold);
}
@keyframes swing {
  0%, 100% { transform: rotate(-7deg); }
  50% { transform: rotate(7deg); }
}
.page { position: relative; z-index: 2; }
.hero {
  text-align: center; padding: 72px 2rem 1.5rem;
}
.moon {
  font-size: 3.5rem; display: inline-block;
  animation: glow 3s ease-in-out infinite;
}
@keyframes glow {
  0%,100% { filter: drop-shadow(0 0 12px #f0d08066); }
  50%      { filter: drop-shadow(0 0 30px #f0d080bb); }
}
.eid-title {
  font-family: 'Cinzel Decorative', cursive;
  font-size: clamp(2.2rem, 6vw, 4.2rem);
  color: var(--gold);
  text-shadow: 0 0 30px #c9a84c55, 0 2px 6px #0006;
  animation: riseUp 1.2s ease both;
}
.eid-sub {
  font-family: 'Cinzel Decorative', cursive;
  font-size: clamp(1.1rem, 3vw, 2rem);
  color: var(--gold-light);
  opacity: .85;
  animation: riseUp 1.4s ease both;
}
.arabic {
  font-size: clamp(1.4rem, 4vw, 2.3rem);
  color: var(--cream); opacity: .88;
  margin: .4rem 0 1.8rem;
  animation: riseUp 1.6s ease both;
}
@keyframes riseUp {
  from { opacity:0; transform: translateY(24px); }
  to   { opacity:1; transform: translateY(0); }
}
.divider {
  display: flex; align-items: center; justify-content: center;
  gap: 1rem; margin: .5rem auto 2.5rem; max-width: 480px;
  animation: riseUp 1.8s ease both;
}
.divider-line { flex:1; height:1px; background: linear-gradient(90deg,transparent,var(--gold),transparent); }
.divider-gem  { color: var(--gold); font-size: 1.2rem; }
.photos {
  display: flex; justify-content: center; align-items: flex-end;
  gap: 2rem; flex-wrap: wrap; padding: 0 2rem 2.5rem;
  animation: riseUp 2s ease both;
}
.frame {
  border: 3px solid var(--gold);
  border-radius: 3px; overflow: hidden;
  box-shadow: 0 0 0 1px #8a6a1a, 0 8px 40px #00000088, inset 0 0 20px #c9a84c18;
  transition: transform .4s ease, box-shadow .4s ease;
  position: relative;
}
.frame:hover {
  transform: translateY(-10px) scale(1.025) !important;
  box-shadow: 0 0 0 2px var(--gold), 0 24px 60px #000000aa, 0 0 50px #c9a84c28;
}
.frame img { display:block; width:100%; height:100%; object-fit:cover; }
.frame:nth-child(1) { width: clamp(190px,28vw,310px); height: clamp(250px,38vw,410px); transform: rotate(-2.5deg); }
.frame:nth-child(2) { width: clamp(175px,26vw,290px); height: clamp(290px,44vw,470px); transform: rotate(2deg); }
.frame::before, .frame::after {
  content:'✦'; position:absolute; color:var(--gold); font-size:.9rem;
  z-index:3; text-shadow: 0 0 8px var(--gold);
}
.frame::before { top:5px; left:7px; }
.frame::after  { bottom:5px; right:7px; }
.caption {
  text-align:center; padding: .5rem 2rem 2rem;
  animation: riseUp 2.2s ease both;
}
.caption p {
  font-size: clamp(1rem, 2.5vw, 1.3rem);
  color: var(--gold-light); opacity: .82;
  font-style: italic; line-height: 1.9;
}
.footer {
  text-align:center; padding: 1.5rem 2rem;
  border-top: 1px solid #c9a84c28;
  font-size: .8rem; color: var(--gold-dark);
  letter-spacing: .12em; animation: riseUp 2.4s ease both;
}
.petal {
  position:fixed; pointer-events:none; z-index:1;
  animation: fall linear infinite; opacity:0;
}
@keyframes fall {
  0%   { transform: translateY(-30px) rotate(0deg); opacity:.7; }
  100% { transform: translateY(110vh) rotate(400deg); opacity:0; }
}
.ornament { text-align:center; font-size:1.4rem; color:var(--gold); letter-spacing:.9rem; padding-top:10px; position:relative; z-index:2; text-shadow:0 0 12px #c9a84c50; }
</style>
</head>
<body>

<div class="rope"></div>
<div class="lanterns" id="lanterns"></div>
<div id="petals"></div>

  <div class="ornament">✦ ☽ ✦ ☾ ✦</div>

    <div class="moon">🌙</div>

    <div class="divider">
